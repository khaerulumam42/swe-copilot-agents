[project]
name = "swe-copilot-agents"
version = "0.1.12"
description = "GitHub Copilot agents for AI-assisted software development"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Khaerul Umam", email = "khaerul@example.com" }
]
keywords = ["github", "copilot", "agents", "ai", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

dependencies = []

[project.scripts]
swe-copilot-agents = "awesome_copilot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/khaerulumam42/swe-copilot-agents"
Repository = "https://github.com/khaerulumam42/swe-copilot-agents"
Issues = "https://github.com/khaerulumam42/swe-copilot-agents/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "awesome_copilot/**/*.py",
    "awesome_copilot/**/*.pth",
    "agents/*.agent.md",
    "README.md",
    "CLAUDE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["awesome_copilot"]

[tool.hatch.build.targets.wheel.force-include]
"agents" = "awesome_copilot/agents"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ['py39']
