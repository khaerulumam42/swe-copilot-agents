[project]
name = "awesome-copilot-agents"
version = "0.1.0"
description = "GitHub Copilot custom agents for orchestrating the complete software development lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["github", "copilot", "agents", "ai", "development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

# PDF slides skill as an optional extra
pdf-slides = [
    "reportlab>=4.2.0",
    "matplotlib>=3.9.0",
    "pillow>=10.4.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
awesome-copilot = "awesome_copilot:main"
pdf-slides = "skills.pdf_slides.skill:main"

[project.urls]
Homepage = "https://github.com/yourusername/awesome-skills"
Repository = "https://github.com/yourusername/awesome-skills"
Issues = "https://github.com/yourusername/awesome-skills/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "awesome_copilot/**/*.py",
    "agents/*.agent.md",
    "copilot-agent-sources/*",
    "skills/pdf-slides/**/*.py",
    "README.md",
    "CLAUDE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["awesome_copilot"]

[tool.hatch.build.targets.wheel.shared-data]
"agents" = "share/awesome-copilot/agents"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']
