name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest pytest-cov

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Install package (Unix)
        if: runner.os != 'Windows'
        run: pip install dist/*.whl

      - name: Install package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $whl = Get-ChildItem dist\*.whl | Select-Object -First 1 -ExpandProperty FullName
          pip install $whl

      - name: Run pytest
        run: pytest tests/ -v --tb=short

      - name: Test CLI end-to-end (Unix)
        if: runner.os != 'Windows'
        run: |
          tmp=$(mktemp -d)
          cd "$tmp"
          swe-copilot-agents
          ls -la .github/agents/
          python -c "
          import sys
          from pathlib import Path
          agents = list(Path('.github/agents').glob('*.agent.md'))
          print(f'Found {len(agents)} agent(s)')
          assert agents, 'No agents installed'
          "

      - name: Test CLI end-to-end (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = New-TemporaryFile | ForEach-Object { Remove-Item $_; New-Item -ItemType Directory -Path "$($_.FullName)" }
          Set-Location $tmp
          swe-copilot-agents
          Get-ChildItem .github\agents\
          python -c @"
          from pathlib import Path
          agents = list(Path('.github/agents').glob('*.agent.md'))
          print(f'Found {len(agents)} agent(s)')
          assert agents, 'No agents installed'
          "@

  validate-agents:
    name: Validate agent files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run agent validation tests
        run: pytest tests/test_agents.py -v --tb=short

      - name: Count agents (informational)
        run: |
          count=$(ls -1 agents/*.agent.md 2>/dev/null | wc -l)
          echo "Found $count agent file(s)"
