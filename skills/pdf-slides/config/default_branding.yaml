# Default Branding Configuration for PDF Slide Decks
# This file defines the default colors, typography, and layout settings.

colors:
  # Main brand colors
  primary: "#2E5BFF"
  secondary: "#6C7A9C"
  accent: "#00D9A0"

  # Background and text colors
  background: "#FFFFFF"
  text: "#1A1A2E"
  text_light: "#6C7A9C"
  border: "#E0E0E0"

  # Semantic colors
  success: "#00D9A0"
  warning: "#FFB800"
  error: "#FF6B6B"

  # Chart color palette (used for data visualizations)
  chart_colors:
    - "#2E5BFF"  # Primary blue
    - "#00D9A0"  # Accent green
    - "#FFB800"  # Warning yellow
    - "#FF6B6B"  # Error red
    - "#9B59B6"  # Purple
    - "#3498DB"  # Light blue
    - "#1ABC9C"  # Teal
    - "#E74C3C"  # Red

typography:
  fonts:
    # Font family names (Helvetica is default PDF font)
    # For custom fonts, register them via BrandManager.register_custom_font()
    title: "Helvetica-Bold"
    heading: "Helvetica-Bold"
    subheading: "Helvetica-Bold"
    body: "Helvetica"
    caption: "Helvetica"

  sizes:
    # Font sizes in points
    title: 48
    heading: 32
    subheading: 24
    body: 18
    caption: 14

layout:
  # Slide format
  slide_format: "16:9"

  # Margins in points (72 points = 1 inch)
  margins:
    top: 72
    bottom: 72
    left: 72
    right: 72

  # Logo configuration
  logo:
    placement: "top-right"  # top-right, top-left
    width: 120              # Width in points
    # path: "/path/to/logo.png"  # Uncomment to set default logo
